name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Measured, not assumed: GitHub's ubuntu runners also refuse unshare(2) for
    # the test user, so the namespace ablation tests skip here exactly as they
    # do on Colab. The seccomp-enforced ones DO run, which is where the ablation
    # machinery actually gets covered. The capability report below exists so a
    # green tick can be read correctly rather than taken to mean everything ran.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Report sandbox capabilities
        # Printed rather than asserted: which isolation backend is available is
        # a property of the host, and the suite skips accordingly. Knowing what
        # the runner supported is essential to reading a green tick correctly.
        run: |
          echo "uid=$(id -u)"
          unshare --fork --pid --mount true && echo "unshare: OK" || echo "unshare: DENIED"
          docker info >/dev/null 2>&1 && echo "docker: OK" || echo "docker: absent"
          python -c "from sandbox_lab.sandbox import seccomp_available; print('seccomp:', seccomp_available())"
      - name: Test
        run: pytest tests/ -q -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts
