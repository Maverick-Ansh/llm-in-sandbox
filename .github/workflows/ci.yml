name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Ubuntu runners are full VMs, so unlike the Colab container they permit
    # unshare(2). The namespace-enforced ablation tests actually execute here,
    # which is the only place in this project they get real coverage.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Report sandbox capabilities
        # Printed rather than asserted: which isolation backend is available is
        # a property of the host, and the suite skips accordingly. Knowing what
        # the runner supported is essential to reading a green tick correctly.
        run: |
          echo "uid=$(id -u)"
          unshare --fork --pid --mount true && echo "unshare: OK" || echo "unshare: DENIED"
          docker info >/dev/null 2>&1 && echo "docker: OK" || echo "docker: absent"
      - name: Test
        run: pytest tests/ -q -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts
